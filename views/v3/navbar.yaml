# bottom tab bar, included at the end of every v3 view.
# icon_color lights a tab's icon amber when its group is on (like the classic
# home's buttons); off returns null, which keeps the normal icon color. The
# selected tab still gets its own pill and amber label.
type: custom:navbar-card
mobile:
  show_labels: true
  safe_area: true
# shorter bar on phones: 6px above, 4px plus the home-indicator inset below
# (was 12px and 12px), a 30px icon pill (was 36) and 16px labels (was 19).
# Each tab stays 46px tall to tap. 81px to 58px before the inset.
styles: |
  .navbar-card.mobile {
    padding-top: 6px !important;
  }
  .navbar.mobile.safe-area:not(.floating) .navbar-card {
    padding-bottom: calc(4px + var(--safe-area-inset-bottom, 0px)) !important;
  }
  .navbar-card.mobile .button {
    height: 30px;
  }
  .navbar-card.mobile .label {
    line-height: 16px;
  }
# room left under the last card for the bar (default 80, sized for the old one)
layout:
  auto_padding:
    mobile_px: 64
desktop:
  position: bottom
  show_labels: true
routes:
  - label: "Home"
    url: /home-v3/home
    icon: mdi:home-outline
    icon_selected: mdi:home
    # cameras and climate are reached from home (camera image, thermostat chip),
    # so keep home lit there
    selected: >-
      [[[ return ['/home-v3', '/home-v3/', '/home-v3/home', '/home-v3/cameras', '/home-v3/climate'].includes(window.location.pathname); ]]]

  - label: "Lights"
    url: /home-v3/lights
    icon: mdi:lightbulb-outline
    icon_selected: mdi:lightbulb
    # amber when any light is on (light.house), like the classic home buttons
    icon_color: >-
      [[[ return states['light.house']?.state === 'on' ? '#FFD600' : null; ]]]

  - label: "Media"
    url: /home-v3/media
    icon: mdi:play-circle-outline
    icon_selected: mdi:play-circle
    # amber when anything is playing (binary_sensor.media_players), like the classic home buttons
    icon_color: >-
      [[[ return states['binary_sensor.media_players']?.state === 'on' ? '#FFD600' : null; ]]]
    badge:
      show: >-
        [[[ return states['binary_sensor.media_players']?.state === 'on'; ]]]

  - label: "More"
    url: /home-v3/more
    icon: mdi:dots-horizontal
    icon_selected: mdi:dots-horizontal-circle
    # advanced is reached from more
    selected: >-
      [[[ return ['/home-v3/more', '/home-v3/advanced'].includes(window.location.pathname); ]]]
