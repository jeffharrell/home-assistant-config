title: "Media"
path: "media"
back_path: "home"
subview: true
type: sections
max_columns: 1
sections:

  - type: grid
    cards:
      # play music (same helpers as the classic media view)
      - type: tile
        entity: input_boolean.play_kitchen_music
        name: "Kitchen Music"
        icon: mdi:music
        hide_state: true
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: input_boolean.play_outside_music
        name: "Outside Music"
        icon: mdi:music
        hide_state: true
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

  # now playing: only players that are playing or paused
  # (off, idle and unavailable stay hidden)
  - type: grid
    cards:
      - type: heading
        heading: "Now playing"
        heading_style: subtitle

      - type: markdown
        text_only: true
        content: "Nothing playing"
        visibility:
          - condition: state
            entity: media_player.family_room_apple_tv
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.living_room_apple_tv
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.master_bedroom_apple_tv
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.family_room_speakers
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.living_room_speakers
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.kitchen_hub
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.master_bedroom_speaker
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.office_speakers
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.garage_speakers
            state_not: ["playing", "paused"]
          - condition: state
            entity: media_player.outside_speakers
            state_not: ["playing", "paused"]

      - type: media-control
        entity: media_player.family_room_apple_tv
        name: "Family Room TV"
        visibility:
          - condition: state
            entity: media_player.family_room_apple_tv
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.living_room_apple_tv
        name: "Living Room TV"
        visibility:
          - condition: state
            entity: media_player.living_room_apple_tv
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.master_bedroom_apple_tv
        name: "Master Bedroom TV"
        visibility:
          - condition: state
            entity: media_player.master_bedroom_apple_tv
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.family_room_speakers
        name: "Family Room Speakers"
        visibility:
          - condition: state
            entity: media_player.family_room_speakers
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.living_room_speakers
        name: "Living Room Speakers"
        visibility:
          - condition: state
            entity: media_player.living_room_speakers
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.kitchen_hub
        name: "Kitchen Hub Speaker"
        visibility:
          - condition: state
            entity: media_player.kitchen_hub
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.master_bedroom_speaker
        name: "Master Bedroom Speakers"
        visibility:
          - condition: state
            entity: media_player.master_bedroom_speaker
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.office_speakers
        name: "Office Speakers"
        visibility:
          - condition: state
            entity: media_player.office_speakers
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.garage_speakers
        name: "Garage Speakers"
        visibility:
          - condition: state
            entity: media_player.garage_speakers
            state: ["playing", "paused"]

      - type: media-control
        entity: media_player.outside_speakers
        name: "Outside Speakers"
        visibility:
          - condition: state
            entity: media_player.outside_speakers
            state: ["playing", "paused"]

      - !include navbar.yaml
