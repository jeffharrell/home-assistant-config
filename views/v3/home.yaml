title: "Home"
path: "home"
theme: home_v3
type: sections
max_columns: 1

# status chips: one left-aligned row; if they ever outgrow the phone
# they scroll sideways instead of wrapping
header:
  layout: start
  badges_position: bottom
  badges_wrap: scroll

badges:
  - type: entity
    entity: sensor.outside_temp
    icon: mdi:weather-partly-cloudy
    show_name: false

  - type: entity
    entity: climate.home
    show_name: false
    state_content:
      - state
      - temperature
    tap_action:
      action: navigate
      navigation_path: /home-v3/climate

  - type: entity
    entity: sensor.powerwall_charge_actual
    icon: mdi:home-battery-outline
    show_name: false
    tap_action:
      action: navigate
      navigation_path: /home-v3/advanced

  - type: entity
    entity: alarm_control_panel.alarm
    show_name: false

sections:

  # needs attention: only shows when something does
  - type: grid
    visibility:
      - condition: or
        conditions:
          - condition: state
            entity: cover.garage_door_1
            state: ["open", "opening"]
          - condition: state
            entity: cover.garage_door_2
            state: ["open", "opening"]
          - condition: state
            entity: cover.garage_door_3
            state: ["open", "opening"]
          - condition: state
            entity: binary_sensor.doors_and_windows
            state: "on"
          - condition: state
            entity: binary_sensor.garage_side_door_open
            state: "on"
          - condition: state
            entity: binary_sensor.flume_sensor_home_leak_detected
            state: "on"
          - condition: state
            entity: binary_sensor.grid_status
            state: "off"
          - condition: state
            entity: input_boolean.hvac_paused
            state: "on"
          - condition: state
            entity: timer.let_dog_out
            state: ["active", "paused"]
    cards:
      - type: heading
        heading: "Needs attention"
        icon: mdi:alert-circle-outline

      # one amber pill per item. Garages and HVAC: tapping anywhere on the
      # pill runs the action and the "Close"/"Resume" button is drawn by the
      # att-close/att-resume classes in the home_v3 theme. Hold and double
      # tap are off so more-info (which has an unconfirmed Open) can't open.
      - type: tile
        entity: cover.garage_door_3
        name: "Jillian's Garage is open"
        icon: mdi:garage-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: cover.garage_door_3
            state: ["open", "opening"]
        tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_3
        icon_tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_3
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_hold_action:
          action: none
        icon_double_tap_action:
          action: none
        card_mod:
          class: "att att-close"

      - type: tile
        entity: cover.garage_door_2
        name: "Jeff's Garage is open"
        icon: mdi:garage-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: cover.garage_door_2
            state: ["open", "opening"]
        tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_2
        icon_tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_2
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_hold_action:
          action: none
        icon_double_tap_action:
          action: none
        card_mod:
          class: "att att-close"

      - type: tile
        entity: cover.garage_door_1
        name: "Guest Garage is open"
        icon: mdi:garage-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: cover.garage_door_1
            state: ["open", "opening"]
        tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_1
        icon_tap_action:
          action: perform-action
          perform_action: cover.close_cover
          target:
            entity_id: cover.garage_door_1
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_hold_action:
          action: none
        icon_double_tap_action:
          action: none
        card_mod:
          class: "att att-close"

      - type: tile
        entity: input_boolean.hvac_paused
        name: "HVAC is paused"
        icon: mdi:hvac-off
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: input_boolean.hvac_paused
            state: "on"
        tap_action:
          action: perform-action
          perform_action: script.hvac_resume
        icon_tap_action:
          action: perform-action
          perform_action: script.hvac_resume
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon_hold_action:
          action: none
        icon_double_tap_action:
          action: none
        card_mod:
          class: "att att-resume"

      # informational: no button, tap opens more-info as before
      - type: tile
        entity: binary_sensor.flume_sensor_home_leak_detected
        name: "Potential water leak"
        icon: mdi:water-alert
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.flume_sensor_home_leak_detected
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.grid_status
        name: "Grid is down, on Powerwall"
        icon: mdi:transmission-tower-off
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.grid_status
            state: "off"
        tap_action:
          action: more-info
          entity: sensor.powerwall_charge_actual
        card_mod:
          class: att

      # the timer's own state is the countdown
      - type: tile
        entity: timer.let_dog_out
        name: "Alarm re-arms in"
        icon: mdi:dog-side
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: timer.let_dog_out
            state: ["active", "paused"]
        card_mod:
          class: att

      # open doors and windows, one pill each
      - type: tile
        entity: binary_sensor.front_door
        name: "Front Door is open"
        icon: mdi:door-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.front_door
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.family_room_doors
        name: "Family Room Doors are open"
        icon: mdi:door-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.family_room_doors
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.master_bedroom_doors
        name: "Master Bedroom Doors are open"
        icon: mdi:door-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.master_bedroom_doors
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.laundry_room_door
        name: "Laundry Room Door is open"
        icon: mdi:door-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.laundry_room_door
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.garage_side_door_open
        name: "Garage Side Door is open"
        icon: mdi:door-open
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.garage_side_door_open
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.dining_room_window
        name: "Dining Room Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.dining_room_window
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.living_room_window_left
        name: "Living Room Window (left) is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.living_room_window_left
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.living_room_window_right
        name: "Living Room Window (right) is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.living_room_window_right
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.kitchen_window
        name: "Kitchen Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.kitchen_window
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.boys_window
        name: "Boys' Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.boys_window
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.office_window
        name: "Office Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.office_window
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.guest_window
        name: "Guest Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.guest_window
            state: "on"
        card_mod:
          class: att

      - type: tile
        entity: binary_sensor.master_bedroom_window
        name: "Master Bedroom Window is open"
        icon: mdi:window-open-variant
        state_content: last_changed
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: binary_sensor.master_bedroom_window
            state: "on"
        card_mod:
          class: att

  # cameras
  - type: grid
    cards:
      - type: heading
        heading: "Cameras"
        icon: mdi:cctv
        tap_action:
          action: navigate
          navigation_path: /home-v3/cameras
        badges:
          - type: entity
            entity: counter.camera_motion
            icon: mdi:motion-sensor
            show_state: true
            visibility:
              - condition: numeric_state
                entity: counter.camera_motion
                above: 0
            tap_action:
              action: navigate
              navigation_path: /home-v3/cameras

      - type: picture-entity
        entity: camera.front_patio
        camera_view: live
        show_name: false
        show_state: false
        tap_action:
          action: navigate
          navigation_path: /home-v3/cameras
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.front_door
        name: "Front Door"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: /home-v3/cameras
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.driveway
        name: "Driveway"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: /home-v3/cameras
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.back_yard
        name: "Back Yard"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: navigate
          navigation_path: /home-v3/cameras
        hold_action:
          action: none

  # quick: contextual actions (same rules as the classic home) + alarm
  - type: grid
    cards:
      - type: heading
        heading: "Quick"
        heading_style: subtitle

      - type: tile
        entity: script.mood_lights
        hide_state: true
        visibility:
          - condition: state
            entity: sun.sun
            state: "below_horizon"
          - condition: state
            entity: alarm_control_panel.alarm
            state: "disarmed"
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: script.dinner_lights
        hide_state: true
        visibility:
          - condition: state
            entity: sun.sun
            state: "below_horizon"
          - condition: state
            entity: schedule.quick_actions_dinner_time
            state: "on"
          - condition: state
            entity: alarm_control_panel.alarm
            state: "disarmed"
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: script.good_night
        hide_state: true
        visibility:
          - condition: state
            entity: schedule.quick_actions_good_night
            state: "on"
          - condition: state
            entity: alarm_control_panel.alarm
            state: "disarmed"
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: script.let_dog_out
        hide_state: true
        visibility:
          - condition: state
            entity: alarm_control_panel.alarm
            state: "armed_home"
          - condition: state
            entity: script.let_dog_out
            state: "off"
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: script.wake_up
        hide_state: true
        visibility:
          - condition: state
            entity: schedule.quick_actions_wake_up
            state: "on"
          - condition: state
            entity: alarm_control_panel.alarm
            state: "armed_home"
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      # alarm: always here
      - type: tile
        entity: alarm_control_panel.alarm
        name: "Alarm"
        tap_action:
          action: more-info
        icon_tap_action:
          action: more-info

      - !include navbar.yaml
