title: "Cameras"
path: "cameras"
back_path: "home"
subview: true
type: sections
max_columns: 1
sections:

  # live feeds
  - type: grid
    cards:
      - type: picture-entity
        entity: camera.front_door
        name: "Front Door"
        camera_view: live
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 6
        tap_action:
          action: more-info
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.front_patio
        name: "Front Patio"
        camera_view: live
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 6
        tap_action:
          action: more-info
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.driveway
        name: "Driveway"
        camera_view: live
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 6
        tap_action:
          action: more-info
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.back_yard
        name: "Back Yard"
        camera_view: live
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 6
        tap_action:
          action: more-info
        hold_action:
          action: none

  # latest events (snapshots saved by script.camera_snapshot_notify)
  - type: grid
    cards:
      - type: heading
        heading: "Latest events"
        heading_style: subtitle

      - type: picture-entity
        entity: camera.latest_doorbell
        name: "Doorbell"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: more-info
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.latest_motion
        name: "Motion"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: more-info
        hold_action:
          action: none

      - type: picture-entity
        entity: camera.latest_mailbox
        name: "Mailbox"
        aspect_ratio: 16x9
        show_state: false
        grid_options:
          columns: 4
        tap_action:
          action: more-info
        hold_action:
          action: none

  # alerts (moved from the classic outside view)
  - type: grid
    cards:
      - type: heading
        heading: "Alerts"
        heading_style: subtitle

      - type: entities
        show_header_toggle: false
        entities:
          - entity: automation.cameras_doorbell
            name: "Doorbell alerts"
            icon: mdi:doorbell-video
            tap_action:
              action: none
          - entity: automation.cameras_mailbox_open
            name: "Mailbox alerts"
            icon: mdi:mailbox
            tap_action:
              action: none
          - entity: input_boolean.camera_motion_enabled
            name: "Motion alerts"
            icon: mdi:motion-sensor
            tap_action:
              action: none

      - !include navbar.yaml
