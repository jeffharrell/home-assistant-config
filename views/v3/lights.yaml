title: "Lights"
path: "lights"
theme: home_v3
back_path: "home"
subview: true
type: sections
max_columns: 1
sections:

  - type: grid
    cards:
      # scenes
      - type: tile
        entity: script.dinner_lights
        name: "Dinner"
        hide_state: true
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      - type: tile
        entity: script.mood_lights
        name: "Mood"
        hide_state: true
        tap_action:
          action: toggle
        icon_tap_action:
          action: toggle

      # count + all off
      - type: markdown
        text_only: true
        content: >-
          {% set on = expand('light.house') | selectattr('state', 'eq', 'on') | list | count %}
          {%- if on == 0 -%}
            All lights are off
          {%- else -%}
            **{{ on }} on**
          {%- endif %}
        grid_options:
          columns: 6

      - type: tile
        entity: light.house
        name: "All off"
        icon: mdi:lightbulb-group-off-outline
        hide_state: true
        grid_options:
          columns: 6
        visibility:
          - condition: state
            entity: light.house
            state: "on"
        tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: light.house
        icon_tap_action:
          action: perform-action
          perform_action: light.turn_off
          target:
            entity_id: light.house

  # inside: one full-width row per room, like a list. dimmable rooms are
  # two tiles each: on shows a brightness slider + %, off shows no bar
  # (tile features have no visibility of their own). living room and
  # hallway are switches, so they never get a bar.
  - type: grid
    cards:
      - type: heading
        heading: "Inside"
        heading_style: subtitle

      - type: tile
        entity: light.kitchen_area
        name: "Kitchen"
        state_content: brightness
        features_position: inline
        features:
          - type: light-brightness
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.kitchen_area
            state: "on"

      - type: tile
        entity: light.kitchen_area
        name: "Kitchen"
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.kitchen_area
            state_not: "on"

      - type: tile
        entity: light.family_room
        name: "Family Room"
        state_content: brightness
        features_position: inline
        features:
          - type: light-brightness
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.family_room
            state: "on"

      - type: tile
        entity: light.family_room
        name: "Family Room"
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.family_room
            state_not: "on"

      - type: tile
        entity: light.living_room
        name: "Living Room"
        grid_options:
          columns: full

      - type: tile
        entity: light.dining_room
        name: "Dining Room"
        state_content: brightness
        features_position: inline
        features:
          - type: light-brightness
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.dining_room
            state: "on"

      - type: tile
        entity: light.dining_room
        name: "Dining Room"
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.dining_room
            state_not: "on"

      - type: tile
        entity: light.bedroom_area
        name: "Bedrooms"
        state_content: brightness
        features_position: inline
        features:
          - type: light-brightness
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.bedroom_area
            state: "on"

      - type: tile
        entity: light.bedroom_area
        name: "Bedrooms"
        grid_options:
          columns: full
        visibility:
          - condition: state
            entity: light.bedroom_area
            state_not: "on"

      - type: tile
        entity: light.hallway
        name: "Hallway"
        grid_options:
          columns: full

  - type: grid
    cards:
      - type: heading
        heading: "Outside"
        heading_style: subtitle

      - type: tile
        entity: light.outside_area
        name: "Outside Lights"

      - type: tile
        entity: switch.front_landscape
        name: "Front Landscape"
        icon: mdi:outdoor-lamp
        tap_action:
          action: toggle

      - type: tile
        entity: switch.back_landscape
        name: "Back Landscape"
        icon: mdi:outdoor-lamp
        tap_action:
          action: toggle

      - type: tile
        entity: switch.fountain
        name: "Fountain"
        icon: mdi:fountain
        tap_action:
          action: toggle

      - type: tile
        entity: switch.garage_fan
        name: "Garage Fan"
        icon: mdi:fan
        tap_action:
          action: toggle

      - !include navbar.yaml
