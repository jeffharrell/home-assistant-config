title: "Advanced"
path: "advanced"
back_path: "more"
subview: true
type: sections
max_columns: 1
sections:

  # power (same content as views/v2/advanced.yaml)
  - type: grid
    cards:
      - type: statistics-graph
        title: "Powerwall"
        chart_type: line
        days_to_show: 1
        period: 5minute
        stat_types: mean
        hide_legend: true
        entities:
          - entity: sensor.powerwall_battery_now
            name: "Powerwall"
          - entity: sensor.powerwall_site_now
            name: "Grid"

      - type: statistic
        name: "Grid Import"
        entity: sensor.powerwall_site_import
        period:
          calendar:
            period: day
        stat_type: change
        grid_options:
          columns: 6

      - type: statistic
        name: "Grid Export"
        entity: sensor.powerwall_site_export
        period:
          calendar:
            period: day
        stat_type: change
        grid_options:
          columns: 6

      - type: statistic
        name: "Solar Generation"
        entity: sensor.powerwall_solar_export
        period:
          calendar:
            period: day
        stat_type: change
        grid_options:
          columns: 6

      - type: sensor
        name: "Solar Now"
        entity: sensor.powerwall_solar_now
        grid_options:
          columns: 6

      - type: statistic
        name: "Home Usage"
        entity: sensor.powerwall_load_import
        period:
          calendar:
            period: day
        stat_type: change
        grid_options:
          columns: 6

      - type: sensor
        name: "Home Now"
        entity: sensor.powerwall_load_now
        grid_options:
          columns: 6

      - type: sensor
        name: "Water Usage"
        entity: sensor.flume_sensor_home_current_day
        grid_options:
          columns: 6

      - type: sensor
        name: "Water Now"
        entity: sensor.flume_sensor_home_current
        grid_options:
          columns: 6

  # batteries
  - type: grid
    cards:
      - type: heading
        heading: "Batteries"
        heading_style: subtitle

      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.ups_battery_charge
            name: "UPS"
            secondary_info: last-changed
          - type: divider
          - entity: sensor.mailbox_battery_level
            name: "Mailbox Sensor"
            secondary_info: last-changed
          - entity: sensor.garage_side_door_battery_level
            name: "Garage Side Door"
            secondary_info: last-changed
          - entity: sensor.garage_temp_battery
            name: "Garage Temperature Sensor"
            secondary_info: last-changed
          - entity: sensor.outside_battery
            name: "Weather Station"
            secondary_info: last-changed
          - entity: binary_sensor.flume_sensor_home_battery
            name: "Flume Sensor"
            secondary_info: last-changed

  # settings
  - type: grid
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: input_text.camera_motion_prompt
            icon: mdi:creation
            name: "Camera Motion Prompt"
            tap_action:
              action: none

      - !include navbar.yaml
