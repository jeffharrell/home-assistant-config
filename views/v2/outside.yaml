title: "Outside"
path: "outside"
back_path: "home"
subview: true
theme: subview
cards:

  - type: vertical-stack
    cards:

      # tiles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.fountain
            theme: round_button
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          - type: tile
            entity: switch.garage_fan
            theme: round_button
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            margin-top: 30px;
            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: vertical-stack
          cards:
            # garages: one row each with a single button (drawn by the gar-*
            # classes in the subview theme). Tapping the row asks first, for
            # both open and close. Hold / double tap are off so more-info's
            # unconfirmed controls can't fire. Each garage has two tiles that
            # swap on state, so a row never disappears.
            # Jillian's Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_3
              name: "Jillian's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_3
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Open Jillian's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Open Jillian's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Jillian's Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_3
              name: "Jillian's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_3
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Close Jillian's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Close Jillian's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

            # Jeff's Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_2
              name: "Jeff's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_2
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Open Jeff's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Open Jeff's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Jeff's Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_2
              name: "Jeff's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_2
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Close Jeff's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Close Jeff's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

            # Guest Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_1
              name: "Guest Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_1
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Open the guest garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Open the guest garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Guest Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_1
              name: "Guest Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_1
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Close the guest garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Close the guest garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

      # landscape lights: one status row (read-only; they run on the
      # "Landscape - Lighting" schedule in packages/landscape.yaml: on at
      # sunset + 15 min, off at 23:00; keep "11 PM" below in step with it)
      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            margin-top: 16px;
            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: markdown
          text_only: true
          content: >-
            {%- set front = is_state('switch.front_landscape', 'on') -%}
            {%- set back = is_state('switch.back_landscape', 'on') -%}
            <ha-icon icon="mdi:outdoor-lamp"></ha-icon>
            <h3>Landscape Lights</h3>
            <p>
            {%- if front and back -%} Front and back on · Off at 11 PM
            {%- elif front -%} Front on · Off at 11 PM
            {%- elif back -%} Back on · Off at 11 PM
            {%- elif state_attr('sun.sun', 'next_setting') -%} Off · On at {{ (as_datetime(state_attr('sun.sun', 'next_setting')) + timedelta(minutes=15)) | as_local | as_timestamp | timestamp_custom('%-I:%M %p') }}
            {%- else -%} Off · On at sunset
            {%- endif -%}
            </p>
          card_mod:
            style:
              .: |
                ha-card { background: none; border: none; box-shadow: none; padding: 12px 16px !important; }
              ha-markdown $: |
                ha-markdown-element, :host { position: relative; display: block; min-height: 40px; }
                ha-icon {
                  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
                  width: 40px; height: 40px; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center;
                  --mdc-icon-size: 24px;
                  {% if is_state('switch.front_landscape', 'on') or is_state('switch.back_landscape', 'on') %}
                  background: rgba(255, 214, 0, 0.16); color: #FFD600;
                  {% else %}
                  background: rgba(255, 255, 255, 0.08); color: var(--state-inactive-color, var(--secondary-text-color));
                  {% endif %}
                }
                h3, p { margin: 0 0 0 56px; }
                h3 { font-size: 16px; font-weight: 400; line-height: 22px; }
                p { font-size: 14px; line-height: 20px; color: var(--secondary-text-color); }

      # what's on
      - type: entity-filter
        card:
          state_color: true
          show_header_toggle: false
          theme: padded_card
        entities:
          - binary_sensor.front_door
          - binary_sensor.family_room_doors
          - binary_sensor.master_bedroom_doors
          - binary_sensor.laundry_room_door
          - binary_sensor.dining_room_window
          - binary_sensor.living_room_window_left
          - binary_sensor.living_room_window_right
          - binary_sensor.kitchen_window
          - binary_sensor.boys_window
          - binary_sensor.office_window
          - binary_sensor.guest_window
          - binary_sensor.master_bedroom_window
          - binary_sensor.garage_side_door_open
          - binary_sensor.garage_door_1_open
          - binary_sensor.garage_door_2_open
          - binary_sensor.garage_door_3_open
        conditions:
          - condition: or
            conditions:
            - condition: state
              state: "open"
            - condition: state
              state: "on"
        show_empty: false

      # settings
      - type: entities
        state_color: false
        theme: settings_card
        entities:
          - entity: input_boolean.camera_motion_enabled
            icon: mdi:creation
            name: "Motion Alerts"
            tap_action:
              action: none
          - entity: automation.cameras_doorbell
            icon: mdi:creation
            name: "Doorbell Alerts"
            tap_action:
              action: none
          - entity: automation.cameras_mailbox_open
            icon: mdi:creation
            name: "Mailbox Alerts"
            tap_action:
              action: none