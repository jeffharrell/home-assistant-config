title: "Outside"
path: "outside"
back_path: "home"
subview: true
theme: subview
cards:

  - type: vertical-stack
    cards:

      # tiles
      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.fountain
            theme: round_button
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          - type: tile
            entity: switch.garage_fan
            theme: round_button
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            margin-top: 25px;
            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: vertical-stack
          cards:
            # garages: one row each with a single button (drawn by the gar-*
            # classes in the subview theme). Tapping the row asks first, for
            # both open and close. Hold / double tap are off so more-info's
            # unconfirmed controls can't fire. Each garage has two tiles that
            # swap on state, so a row never disappears.
            # Jillian's Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_3
              name: "Jillian's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_3
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Open Jillian's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Open Jillian's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Jillian's Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_3
              name: "Jillian's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_3
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Close Jillian's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_3
                confirmation:
                  text: "Close Jillian's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

            # Jeff's Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_2
              name: "Jeff's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_2
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Open Jeff's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Open Jeff's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Jeff's Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_2
              name: "Jeff's Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_2
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Close Jeff's garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_2
                confirmation:
                  text: "Close Jeff's garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

            # Guest Garage: closed (also closing / unknown) shows "Open"
            - type: tile
              entity: cover.garage_door_1
              name: "Guest Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_1
                  state_not: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Open the guest garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.open_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Open the guest garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-open"

            # Guest Garage: open / opening shows amber with "Close"
            - type: tile
              entity: cover.garage_door_1
              name: "Guest Garage"
              state_content:
                - state
                - last_changed
              visibility:
                - condition: state
                  entity: cover.garage_door_1
                  state: ["open", "opening"]
              tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Close the guest garage?"
              icon_tap_action:
                action: perform-action
                perform_action: cover.close_cover
                target:
                  entity_id: cover.garage_door_1
                confirmation:
                  text: "Close the guest garage?"
              hold_action:
                action: none
              double_tap_action:
                action: none
              icon_hold_action:
                action: none
              icon_double_tap_action:
                action: none
              card_mod:
                class: "gar gar-act-close"

      # landscape lights: one status row (read-only; they run on the
      # "Landscape - Lighting" schedule in packages/landscape.yaml: on at
      # sunset + 15 min, off at 23:00; keep "11 PM" below in step with it)
      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            margin-top: 25px;
            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: markdown
          text_only: true
          content: >-
            {%- set front = is_state('switch.front_landscape', 'on') -%}
            {%- set back = is_state('switch.back_landscape', 'on') -%}
            <ha-icon icon="mdi:outdoor-lamp"></ha-icon>
            <h3>Landscape Lights</h3>
            <p>
            {%- if front and back -%} Front and back on · Off at 11 PM
            {%- elif front -%} Front on · Off at 11 PM
            {%- elif back -%} Back on · Off at 11 PM
            {%- elif state_attr('sun.sun', 'next_setting') -%} Off · On at {{ (as_datetime(state_attr('sun.sun', 'next_setting')) + timedelta(minutes=15)) | as_local | as_timestamp | timestamp_custom('%-I:%M %p') }}
            {%- else -%} Off · On at sunset
            {%- endif -%}
            </p>
          card_mod:
            style:
              .: |
                ha-card { background: none; border: none; box-shadow: none; padding: 8px 16px 8px 6px !important; }
              ha-markdown $: |
                ha-markdown-element, :host { position: relative; display: block; min-height: 36px; }
                ha-icon {
                  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
                  width: 36px; height: 36px; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center;
                  --mdc-icon-size: 24px;
                  {% if is_state('switch.front_landscape', 'on') or is_state('switch.back_landscape', 'on') %}
                  background: rgba(255, 214, 0, 0.16); color: #FFD600;
                  {% else %}
                  background: rgba(255, 255, 255, 0.08); color: var(--state-inactive-color, var(--secondary-text-color));
                  {% endif %}
                }
                h3, p { margin: 0 0 0 46px; }
                h3 { font-size: 16px; font-weight: 400; line-height: 20px; }
                p { font-size: 13px; line-height: 16px; color: var(--secondary-text-color); }

      # what's open: one tile per open door, window or garage door, styled
      # like the garage rows ("Open · 5 minutes ago"). The box shows only
      # while something is open (the group covers the same 16 sensors).
      # The icon's own tap action gives it the round background the garage
      # tiles have.
      - type: 'custom:mod-card'
        visibility:
          - condition: state
            entity: binary_sensor.doors_and_windows_and_garages
            state: "on"
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            margin-top: 25px;
            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: vertical-stack
          cards:
            - type: tile
              entity: binary_sensor.front_door
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.front_door
                  state: "on"
            - type: tile
              entity: binary_sensor.family_room_doors
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.family_room_doors
                  state: "on"
            - type: tile
              entity: binary_sensor.master_bedroom_doors
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.master_bedroom_doors
                  state: "on"
            - type: tile
              entity: binary_sensor.laundry_room_door
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.laundry_room_door
                  state: "on"
            - type: tile
              entity: binary_sensor.dining_room_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.dining_room_window
                  state: "on"
            - type: tile
              entity: binary_sensor.living_room_window_left
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.living_room_window_left
                  state: "on"
            - type: tile
              entity: binary_sensor.living_room_window_right
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.living_room_window_right
                  state: "on"
            - type: tile
              entity: binary_sensor.kitchen_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.kitchen_window
                  state: "on"
            - type: tile
              entity: binary_sensor.boys_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.boys_window
                  state: "on"
            - type: tile
              entity: binary_sensor.office_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.office_window
                  state: "on"
            - type: tile
              entity: binary_sensor.guest_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.guest_window
                  state: "on"
            - type: tile
              entity: binary_sensor.master_bedroom_window
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.master_bedroom_window
                  state: "on"
            - type: tile
              entity: binary_sensor.garage_side_door_open
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.garage_side_door_open
                  state: "on"
            - type: tile
              entity: binary_sensor.garage_door_1_open
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.garage_door_1_open
                  state: "on"
            - type: tile
              entity: binary_sensor.garage_door_2_open
              state_content:
                - state
                - last_changed
              icon_tap_action:
                action: more-info
              visibility:
                - condition: state
                  entity: binary_sensor.garage_door_2_open
                  state: "on"
            - type: tile
              entity: binary_sensor.garage_door_3_open
              state_content:
                - state
                - last_changed
              icon_tap_action:
