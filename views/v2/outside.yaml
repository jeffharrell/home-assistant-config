                  entity: binary_sensor.garage_door_3_open
                  state: "on"

      # settings
      - type: entities
        state_color: false
        theme: settings_card
        entities:
          - entity: input_boolean.camera_motion_enabled
            icon: mdi:creation
            name: "Motion Alerts"
            tap_action:
              action: none
          - entity: automation.cameras_doorbell
            icon: mdi:creation
            name: "Doorbell Alerts"
            tap_action:
              action: none
          - entity: automation.cameras_mailbox_open
            icon: mdi:creation
            name: "Mailbox Alerts"
            tap_action:
              action: none