title: "Home"
path: "home"
cards:

  - type: vertical-stack
    cards:

      #status 
      - type: markdown
        content: >-
          {% if is_state('sensor.outside_battery', '- -') -%}
            <ha-icon icon="{{ state_attr('sensor.outside_forecast', 'icon') }}"></ha-icon> The outside weather sensor battery is low
          {%- elif states('sensor.outside_temp') -%}
            <ha-icon icon="{{ state_attr('sensor.outside_forecast', 'icon') }}"></ha-icon> Currently {{ states('sensor.outside_temp')|round(0, default=0) }}°F&nbsp;
            {%- if states('sensor.outside_rain_daily')|float(0) -%}
              with {{ states('sensor.outside_rain_daily') }}" of rain
            {%- elif has_value('sensor.outside_forecast') -%}
              {{ states('sensor.outside_forecast') }}
            {%- endif -%}
          {%- endif -%}


          {%- if has_value('binary_sensor.powerwall_status') and has_value('sensor.powerwall_charge_actual') -%}
            {% set energy = (states('sensor.energy_import')|float(default=0) - states('sensor.energy_export')|float(default=0))|round %}
            <ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon> Powerwall is at {{ states('sensor.powerwall_charge_actual')|round }}% 
            {%- if energy != 0 %} with {{ energy }} kWh grid use{%- endif -%}
          {%- endif -%}
        text_only: true
        card_mod:
          style: |
            ha-card { 
              margin-top: -45px;
              padding-bottom: 4px;
              transition: none;
              line-height: 1.8em;
            }

      # picture
      - type: custom:config-template-card
        entities:
          - counter.camera_motion
        card:
          type: picture-entity
          entity: camera.front_patio
          name: ${ states["counter.camera_motion"].state + " events"}
          show_name: ${ parseInt(states["counter.camera_motion"].state) > 0 }
          show_state: false
          tap_action:
            action: navigate
            navigation_path: cameras
          theme: no_card
          card_mod:
            style: |
              ha-card { 
                margin: 8px -8px 12px;
                min-height: 225px;
                max-height: 240px;
                background: rgba(0, 0, 0, 0.1);
                border: 2px solid rgba(0, 0, 0, 0.1);
                border-left: 0;
                border-right: 0;
                transition: none;

                --ha-picture-card-background-color: rgba(0, 0, 0, 0.15);
                --ha-picture-card-text-color: var(--primary-text-color);
              }

              ha-card .footer {
                font-size: 14px;
                text-align: right;
              }

      # navigation
      - type: grid
        columns: 4
        square: false
        cards:
          - type: button
            entity: light.house
            name: "Lights"
            theme: no_card
            show_state: true
            icon_height: 25px
            tap_action:
              action: navigate
              navigation_path: lights
            hold_action:
              action: navigate
              navigation_path: advanced?disable_km
            
          - type: button
            entity: binary_sensor.media_players
            name: "Media"
            theme: no_card
            show_state: true
            icon_height: 25px
            tap_action:
              action: navigate
              navigation_path: media
            hold_action:
              action: none

          - type: button
            entity: group.climate
            name: "Climate"
            theme: no_card
            show_state: true
            icon: mdi:home-thermometer-outline
            icon_height: 25px
            tap_action:
              action: navigate
              navigation_path: climate
            hold_action:
              action: none
              
          - type: button
            entity: binary_sensor.doors_and_windows_and_garages
            name: "Outside"
            theme: no_card
            show_state: true
            icon: mdi:door
            icon_height: 25px
            tap_action:
              action: navigate
              navigation_path: outside
            hold_action:
              action: none

      # actions. The blank title is breathing room under the nav buttons,
      # squeezed from its default 40px to 20px (about 34px of gap in all).
      - type: vertical-stack
        title: " "
        card_mod:
          style: |
            .card-header {
              padding: 0 !important;
              height: 20px;
              font-size: 0;
              line-height: 0;
              overflow: hidden;
            }
        cards:
          # needs attention: amber tiles, each only while it's true (same
          # as the v3 dashboard). Garages and HVAC: tapping anywhere runs the
          # action (Close / Resume drawn by the attention theme), and hold /
          # double tap are off so more-info's unconfirmed Open can't fire.
          # Close asks for confirmation first (Jeff, 11/8).
          - type: tile
            entity: cover.garage_door_3
            name: "Jillian's Garage is open"
            icon: mdi:garage-open
            state_content: last_changed
            visibility:
              - condition: state
                entity: cover.garage_door_3
                state: ["open", "opening"]
            tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_3
              confirmation:
                text: "Close Jillian's garage?"
            icon_tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_3
              confirmation:
                text: "Close Jillian's garage?"
            hold_action:
              action: none
            double_tap_action:
              action: none
            icon_hold_action:
              action: none
            icon_double_tap_action:
              action: none
            card_mod:
              class: "att att-close"

          - type: tile
            entity: cover.garage_door_2
            name: "Jeff's Garage is open"
            icon: mdi:garage-open
            state_content: last_changed
            visibility:
              - condition: state
                entity: cover.garage_door_2
                state: ["open", "opening"]
            tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_2
              confirmation:
                text: "Close Jeff's garage?"
            icon_tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_2
              confirmation:
                text: "Close Jeff's garage?"
            hold_action:
              action: none
            double_tap_action:
              action: none
            icon_hold_action:
              action: none
            icon_double_tap_action:
              action: none
            card_mod:
              class: "att att-close"

          - type: tile
            entity: cover.garage_door_1
            name: "Guest Garage is open"
            icon: mdi:garage-open
            state_content: last_changed
            visibility:
              - condition: state
                entity: cover.garage_door_1
                state: ["open", "opening"]
            tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_1
              confirmation:
                text: "Close the guest garage?"
            icon_tap_action:
              action: perform-action
              perform_action: cover.close_cover
              target:
                entity_id: cover.garage_door_1
              confirmation:
                text: "Close the guest garage?"
            hold_action:
              action: none
            double_tap_action:
              action: none
            icon_hold_action:
              action: none
            icon_double_tap_action:
              action: none
            card_mod:
              class: "att att-close"

          - type: tile
            entity: input_boolean.hvac_paused
            name: "HVAC is paused"
            icon: mdi:hvac-off
            state_content: last_changed
            visibility:
              - condition: state
                entity: input_boolean.hvac_paused
                state: "on"
            tap_action:
              action: perform-action
              perform_action: script.hvac_resume
            icon_tap_action:
              action: perform-action
              perform_action: script.hvac_resume
            hold_action:
              action: none
            double_tap_action:
              action: none
            icon_hold_action:
              action: none
            icon_double_tap_action:
              action: none
            card_mod:
              class: "att att-resume"

          # doors and windows, rolled up into one line by
          # sensor.open_doors_and_windows (its name is the sentence)
          - type: tile
            entity: sensor.open_doors_and_windows
            visibility:
              - condition: state
                entity: sensor.open_doors_and_windows
                state_not: ["unknown", "unavailable"]
            tap_action:
              action: navigate
              navigation_path: outside
            icon_tap_action:
              action: navigate
              navigation_path: outside
            card_mod:
              class: att

          # informational: tap opens more-info
          - type: tile
            entity: binary_sensor.flume_sensor_home_leak_detected
            name: "Potential water leak"
            icon: mdi:water-alert
            state_content: last_changed
            visibility:
              - condition: state
                entity: binary_sensor.flume_sensor_home_leak_detected
                state: "on"
            card_mod:
              class: att

          - type: tile
            entity: binary_sensor.grid_status
            name: "Grid is down, on Powerwall"
            icon: mdi:transmission-tower-off
            state_content: last_changed
            visibility:
              - condition: state
                entity: binary_sensor.grid_status
                state: "off"
            tap_action:
              action: more-info
              entity: sensor.powerwall_charge_actual
            card_mod:
              class: att

          # the timer's own state is the countdown
          - type: tile
            entity: timer.let_dog_out
            name: "Alarm re-arms in"
            icon: mdi:dog-side
            visibility:
              - condition: state
                entity: timer.let_dog_out
                state: ["active", "paused"]
            card_mod:
              class: att

          # mood lights
          - type: tile
            entity: script.mood_lights
            hide_state: true
            theme: round_button
            visibility:
              - condition: state
                entity: sun.sun
                state: "below_horizon"
              - condition: and
                conditions:
                  - condition: state
                    entity: alarm_control_panel.alarm
                    state: "disarmed"
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          # dinner lights
          - type: tile
            entity: script.dinner_lights
            hide_state: true
            theme: round_button
            visibility:
              - condition: state
                entity: sun.sun
                state: "below_horizon"
              - condition: and
                conditions:
                  - condition: state
                    entity: schedule.quick_actions_dinner_time
                    state: "on"
                  - condition: state
                    entity: alarm_control_panel.alarm
                    state: "disarmed"
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle
 
          # good night
          - type: tile
            entity: script.good_night
            hide_state: true
            theme: round_button
            visibility:
              - condition: state
                entity: schedule.quick_actions_good_night
                state: "on"
              - condition: and
                conditions:
                  - condition: state
                    entity: alarm_control_panel.alarm
                    state: "disarmed"
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          # let dog out
          - type: tile
            entity: script.let_dog_out
            hide_state: true
            theme: round_button
            visibility:
              - condition: state
                entity: alarm_control_panel.alarm
                state: "armed_home"
              - condition: and
                conditions:
                  - condition: state
                    entity: script.let_dog_out
                    state: "off"
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          # wake up
          - type: tile
            entity: script.wake_up
            hide_state: true
            theme: round_button
            visibility:
              - condition: state
                entity: schedule.quick_actions_wake_up
                state: "on"
              - condition: and
                conditions:
                  - condition: state
                    entity: alarm_control_panel.alarm
                    state: "armed_home"
            tap_action:
              action: toggle
            icon_tap_action:
              action: toggle

          # alarm
          - type: tile
            entity: alarm_control_panel.alarm
            hide_state: true
            theme: round_button
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card {
                  --card-mod-icon-color: white;
                  
                  background:
                    {% if "armed_" in states("alarm_control_panel.alarm") %}
                      #aa2e25
                    {% else %}
                      var(--card-background-color)
                    {% endif %}
                    ;
                }