                    {% set p = states('media_player.outside_speakers') in ['playing', 'paused'] %}
                    ha-card { background: none; border: none; box-shadow: none; border-radius: 0; padding: {{ '12px 16px 0 16px' if p else '12px 16px 12px 16px' }} !important; }
                  ha-markdown $: |
                    {% set s = states('media_player.outside_speakers') %}{% set p = s in ['playing', 'paused'] %}
                    ha-markdown-element, :host { position: relative; display: block; min-height: {{ '52px' if p else '36px' }}; }
                    div { position: absolute; left: 0; top: {{ '0' if p else '50%' }}; {{ '' if p else 'transform: translateY(-50%);' }} width: 52px; height: {{ '52px' if p else '36px' }}; display: flex; justify-content: flex-start; margin: 0; }
                    img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: #222222; }
                    ha-icon { display: flex; align-items: center; justify-content: center; flex: none;
                      width: {{ '52px' if p else '36px' }}; height: {{ '52px' if p else '36px' }}; border-radius: {{ '10px' if p else '50%' }};
                      background: {{ 'rgba(255, 214, 0, 0.16)' if p else 'rgba(255, 255, 255, 0.08)' }};
                      color: {{ '#FFD600' if p else 'var(--secondary-text-color)' }};
                      --mdc-icon-size: {{ '26px' if p else '20px' }};
                      opacity: {{ '0.45' if s == 'unavailable' else '1' }}; }
                    h3, h4, p { margin: 0 0 0 66px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                    h3 { font-size: 16px; font-weight: {{ '500' if p else '400' }}; color: var(--primary-text-color); {{ '' if p else 'line-height: 20px;' }} }
                    h4, p { font-size: 13px; font-weight: 400; color: var(--secondary-text-color); }
                    {{ '' if p else 'p { line-height: 16px; }' }}
                    em { font-style: normal; color: #FFD600; }
            - type: 'custom:mod-card'
              visibility:
                - condition: state
                  entity: media_player.outside_speakers
                  state: ["playing", "paused"]
              style:
                .: *flat
                hui-horizontal-stack-card $: *controls_spk
              card:
                type: horizontal-stack
                cards:
                  - type: button
                    icon: mdi:pause
                    show_name: false
                    tap_action:
                      action: perform-action
                      perform_action: media_player.media_pause
                      target:
                        entity_id: media_player.outside_speakers
                    hold_action:
                      action: none
                    visibility:
                      - condition: state
                        entity: media_player.outside_speakers
                        state: "playing"
                    card_mod:
                      style: *btn_amber
                  - type: button
                    icon: mdi:play
                    show_name: false
                    tap_action:
                      action: perform-action
                      perform_action: media_player.media_play
                      target:
                        entity_id: media_player.outside_speakers
                    hold_action:
                      action: none
                    visibility:
                      - condition: state
                        entity: media_player.outside_speakers
                        state: "paused"
                    card_mod:
                      style: *btn_gray
