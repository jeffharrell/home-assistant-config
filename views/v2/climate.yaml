title: "Climate"
path: "climate"
back_path: "home"
subview: true
theme: subview
cards:

  - type: vertical-stack
    cards:

      # thermostat first: inside temp and humidity on the tile, the set point
      # as its own - / + control (so 71 inside and 69 set can't be confused),
      # mode buttons, then the house fan, all in one block like the garages
      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            padding: 6px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: vertical-stack
          cards:
            - type: tile
              entity: climate.home
              name: "Inside now"
              state_content:
                - current_temperature
                - hvac_action
                - current_humidity
              features_position: bottom
              features:
                - type: target-temperature
                - type: climate-hvac-modes
                  style: icons
                  hvac_modes:
                    - "off"
                    - heat
                    - cool
                    - heat_cool

            - type: tile
              entity: switch.house_fan
              tap_action:
                action: toggle
              icon_tap_action:
                action: toggle

      # rooms: one table, column labels on the first row only, no icons.
      # Tapping a room opens its outlet's device page (all its sensors);
      # Garage is a Scrape sensor, so its "device" is just that sensor.
      - type: entities
        theme: padded_card
        entities:
          - type: custom:multiple-entity-row
            entity: sensor.family_room_outlet_temperature
            name: "Family Room"
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /config/devices/device/a963cf83ef138925606b313fdd454d43
            entities:
              - entity: sensor.family_room_outlet_temperature
                name: "TEMP"
                template: "{{ states(entity) | round(0) }}°"
                styles:
                  font-size: 18px
                  width: 52px
                  text-align: right
                tap_action:
                  action: navigate
                  navigation_path: /config/devices/device/a963cf83ef138925606b313fdd454d43
              - entity: sensor.family_room_outlet_humidity
                name: "HUMIDITY"
                template: "{{ states(entity) | round(0) }}%"
                styles:
                  color: var(--secondary-text-color)
                  width: 80px
                  text-align: right
                tap_action:
                  action: navigate
                  navigation_path: /config/devices/device/a963cf83ef138925606b313fdd454d43
            card_mod:
              style:
                hui-generic-entity-row $: |
                  state-badge { display: none; }
                  .info { padding-inline-start: 0 !important; margin-inline-start: 0 !important; }
          - type: custom:multiple-entity-row
            entity: sensor.living_room_outlet_temperature
            name: "Living Room"
