title: "Climate"
path: "climate"
back_path: "home"
subview: true
theme: subview
cards:

  - type: vertical-stack
    cards:

      # thermostat first (design mock "climate-1-thermostat-first"): inside
      # temp big on the left, the set point with round - / + on the right
      # (script.hvac_step nudges it a degree), Off / Heat / Cool pills (Auto doesn't work on this thermostat),
      # then the house fan
      # as a slim row. Built from markdown and button cards, styled with
      # card_mod (Jinja templates pick the selected mode and its color).
      - type: 'custom:mod-card'
        style: |
          ha-card {
            --ha-card-border-color: var(--secondary-background-color);

            padding: 12px 20px 0;
            background-color: var(--secondary-background-color);
          }
        card:
          type: vertical-stack
          cards:
            - type: horizontal-stack
              cards:
                - type: markdown
                  text_only: true
                  content: >-
                    <p>Inside now</p>
                    <h1>{{ state_attr('climate.home', 'current_temperature') | round(0) }}°</h1>
                    <p class="sub">{{ states('climate.home') | replace('heat_cool', 'auto') | capitalize }} · {{ state_attr('climate.home', 'hvac_action') }} · {{ state_attr('climate.home', 'current_humidity') | round(0) }}% humidity</p>
                  card_mod:
                    style:
                      .: |
                        ha-card { background: none; border: none; box-shadow: none; padding: 0 0 0 2px !important; overflow: visible; }
                        ha-markdown { overflow: visible; }
                      ha-markdown $: |
                        p { margin: 0; color: var(--secondary-text-color); font-size: 14px; white-space: nowrap; }
                        h1 { margin: 0 0 2px; font-size: 52px; font-weight: 400; line-height: 1; letter-spacing: -1px; }
                - type: horizontal-stack
                  cards:
                  - type: button
                    icon: mdi:minus
                    show_name: false
                    tap_action:
                      action: perform-action
                      perform_action: script.hvac_step
                      data:
                        step: -1
                    hold_action:
                      action: none
                    card_mod:
                      style: |
                        ha-card { width: 44px; height: 44px !important; border-radius: 50%; margin-top: 18px; padding: 0 !important; border: none; background: rgba(255, 255, 255, 0.08); --mdc-icon-size: 22px; }
                  - type: markdown
                    text_only: true
                    content: >-
                      <p>Set to</p>
                      <h2>{{ state_attr('climate.home', 'temperature') | round(0) if state_attr('climate.home', 'temperature') is number else '–' }}°</h2>
                    card_mod:
                      style:
                        .: |
                          ha-card { background: none; border: none; box-shadow: none; padding: 0 !important; text-align: center; }
                        ha-markdown $: |
                          p { margin: 0; color: var(--secondary-text-color); font-size: 13px; }
                          h2 { margin: 2px 0 0; font-size: 34px; font-weight: 400 !important; line-height: 1.1; color: {% if is_state('climate.home', 'heat') %}var(--state-climate-heat-color, #ff8100){% elif is_state('climate.home', 'cool') %}var(--state-climate-cool-color, #2b9af9){% elif is_state('climate.home', 'heat_cool') %}var(--state-climate-heat-cool-color, #ffb700){% else %}var(--primary-text-color){% endif %}; }
                  - type: button
                    icon: mdi:plus
                    show_name: false
                    tap_action:
                      action: perform-action
                      perform_action: script.hvac_step
                      data:
                        step: 1
                    hold_action:
                      action: none
                    card_mod:
                      style: |
                        ha-card { width: 44px; height: 44px !important; border-radius: 50%; margin-top: 18px; padding: 0 !important; border: none; background: rgba(255, 255, 255, 0.08); --mdc-icon-size: 22px; }

            - type: horizontal-stack
              cards:
              - type: button
                name: "Off"
                show_icon: false
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.home
                  data:
                    hvac_mode: "off"
                hold_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 38px !important;
                      padding: 0 !important;
                      border: none;
                      border-radius: 19px;
                      font-size: 15px !important;
                      font-weight: 500;
                      margin-top: 0;
                      {% if is_state('climate.home', '"off"') %}
                      background: {% if is_state('climate.home', 'heat') %}var(--state-climate-heat-color, #ff8100){% elif is_state('climate.home', 'cool') %}var(--state-climate-cool-color, #2b9af9){% elif is_state('climate.home', 'heat_cool') %}var(--state-climate-heat-cool-color, #ffb700){% else %}rgba(255, 255, 255, 0.3){% endif %};
                      color: #222222;
                      {% else %}
                      background: rgba(255, 255, 255, 0.08);
                      {% endif %}
                    }
              - type: button
                name: "Heat"
                show_icon: false
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.home
                  data:
                    hvac_mode: heat
                hold_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 38px !important;
                      padding: 0 !important;
                      border: none;
                      border-radius: 19px;
                      font-size: 15px !important;
                      font-weight: 500;
                      margin-top: 0;
                      {% if is_state('climate.home', 'heat') %}
                      background: {% if is_state('climate.home', 'heat') %}var(--state-climate-heat-color, #ff8100){% elif is_state('climate.home', 'cool') %}var(--state-climate-cool-color, #2b9af9){% elif is_state('climate.home', 'heat_cool') %}var(--state-climate-heat-cool-color, #ffb700){% else %}rgba(255, 255, 255, 0.3){% endif %};
                      color: #222222;
                      {% else %}
                      background: rgba(255, 255, 255, 0.08);
                      {% endif %}
                    }
              - type: button
                name: "Cool"
                show_icon: false
                tap_action:
                  action: perform-action
                  perform_action: climate.set_hvac_mode
                  target:
                    entity_id: climate.home
                  data:
                    hvac_mode: cool
                hold_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      height: 38px !important;
                      padding: 0 !important;
                      border: none;
                      border-radius: 19px;
                      font-size: 15px !important;
                      font-weight: 500;
                      margin-top: 0;
                      {% if is_state('climate.home', 'cool') %}
                      background: {% if is_state('climate.home', 'heat') %}var(--state-climate-heat-color, #ff8100){% elif is_state('climate.home', 'cool') %}var(--state-climate-cool-color, #2b9af9){% elif is_state('climate.home', 'heat_cool') %}var(--state-climate-heat-cool-color, #ffb700){% else %}rgba(255, 255, 255, 0.3){% endif %};
                      color: #222222;
                      {% else %}
                      background: rgba(255, 255, 255, 0.08);
                      {% endif %}
                    }

            # house fan: slim row under a divider, state on the right
            - type: entities
              entities:
                - type: simple-entity
                  entity: switch.house_fan
                  tap_action:
                    action: toggle
                  card_mod:
                    style:
                      hui-generic-entity-row $: |
                        state-badge { background: rgba(255, 255, 255, 0.08); border-radius: 50%; }
              card_mod:
                style: |
                  ha-card { background: none; box-shadow: none; border: none; border-top: 1px solid var(--divider-color); border-radius: 0; margin: 4px -20px 0; padding: 0 4px; }
                  .card-content { padding-top: 4px !important; padding-bottom: 8px !important; }

      # rooms: one table with a header row; no icons. Holding a room opens
      # its outlet's device page (all its sensors); Garage is a Scrape
      # sensor, so its "device" is just that sensor.
      - type: entities
        theme: padded_card
        entities:
          - type: custom:multiple-entity-row
            entity: sensor.family_room_outlet_temperature
            name: "ROOM"
            show_state: false
            tap_action:
              action: none
            entities:
              - entity: sensor.family_room_outlet_temperature
                name: false
                template: "TEMP"
                tap_action:
                  action: none
                styles:
                  width: 52px
                  text-align: right
                  font-size: 12px
                  letter-spacing: 0.1em
                  color: var(--secondary-text-color)
              - entity: sensor.family_room_outlet_humidity
                name: false
                template: "HUMIDITY"
                tap_action:
                  action: none
                styles:
                  width: 80px
                  text-align: right
                  font-size: 12px
                  letter-spacing: 0.1em
                  color: var(--secondary-text-color)
            card_mod:
              style:
                hui-generic-entity-row $: |
                  state-badge { display: none; }
                  .info { padding-inline-start: 0 !important; margin-inline-start: 0 !important; font-size: 12px; letter-spacing: 0.1em; color: var(--secondary-text-color); }
          - type: custom:multiple-entity-row
            entity: sensor.family_room_outlet_temperature
            name: "Family Room"
            show_state: false
            tap_action:
              action: none
            hold_action:
              action: navigate
              navigation_path: /config/devices/device/a963cf83ef138925606b313fdd454d43
            entities:
              - entity: sensor.family_room_outlet_temperature
                name: false
                template: "{{ (states(entity) | round(0) ~ '°') if is_number(states(entity)) else '–' }}"
                styles:
                  font-size: 18px
                  width: 52px
                  text-align: right
                tap_action:
                  action: none
                hold_action:
                  action: navigate
                  navigation_path: /config/devices/device/a963cf83ef138925606b313fdd454d43
              - entity: sensor.family_room_outlet_humidity
