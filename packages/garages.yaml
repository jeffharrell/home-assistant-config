homeassistant:
    customize_glob:
      "binary_sensor.garage_door_*":
        device_class: opening

template:
  - cover:
    - unique_id: garage_door_1
      state: '{{ is_state("binary_sensor.garage_door_1_open", "on") }}'
      availability: '{{ has_value("binary_sensor.garage_door_1_open") }}'
      device_class: garage
      open_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_1
      close_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_1

    - unique_id: garage_door_2
      state: '{{ is_state("binary_sensor.garage_door_2_open", "on") }}'
      availability: '{{ has_value("binary_sensor.garage_door_2_open") }}'
      device_class: garage
      open_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_2
      close_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_2

    - unique_id: garage_door_3
      state: '{{ is_state("binary_sensor.garage_door_3_open", "on") }}'
      availability: '{{ has_value("binary_sensor.garage_door_3_open") }}'
      device_class: garage
      open_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_3
      close_cover:
        - action: switch.turn_on
          target: 
            entity_id: switch.garage_door_3

automation:
  - alias: "Garages - Door open"
    id: garages_door_open
    trigger:
      platform: state
      entity_id:
        - binary_sensor.garage_door_1_open
        - binary_sensor.garage_door_2_open
        - binary_sensor.garage_door_3_open
      to: "on"
      for:
        minutes: 10
    mode: queued
    actions:
      - action: script.camera_snapshot_notify
        data:
          camera_entity: "camera.driveway"
          slug: "latest_garage"
          title: "{{ trigger.to_state.attributes.friendly_name }} is open"

  - alias: "Garages - Fan"
    id: garages_fan
    trigger:
      - platform: numeric_state
        entity_id: sensor.garage_temp
        above: !secret garage_fan_above
        for:
          minutes: 10
        variables:
          action: "turn_on"
      - platform: numeric_state
        entity_id: sensor.garage_temp
        below: !secret garage_fan_below
        for:
          minutes: 10
        variables:
          action: "turn_off"
    actions:
      - action: >
          switch.{{ action }}
        entity_id: switch.garage_fan