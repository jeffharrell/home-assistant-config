input_boolean:
  # on while hvac_disable is holding the thermostat; survives restarts
  hvac_paused:
    name: "HVAC Paused"
    icon: mdi:hvac-off

template:
  - binary_sensor:
    - name: climate_operation
      state: '{{ not is_state_attr("climate.home", "hvac_action", "idle") }}'
      
automation:
  - alias: "Climate - Windows open"
    id: climate_windows_open
    trigger:
      - platform: state
        entity_id: binary_sensor.doors_and_windows
        to: "on"
        for: "00:20:00"
    condition:
      condition: template
      value_template: "{{ is_state('switch.house_fan', 'off') }}"
    actions:
      - action: script.hvac_disable
      - action: notify.phones
        data:
          title: "Home"
          message: "Turning HVAC off since {{ expand('binary_sensor.doors_and_windows') | selectattr('state', 'eq', 'on') | map(attribute='name')| join(', ') }} is open"
      - delay: "00:00:10"
      - wait_template: "{{ is_state('binary_sensor.doors_and_windows', 'off') }}"
      - action: script.hvac_resume

  - alias: "Climate - Disable HVAC with house fan"
    id: climate_disable_hvac_with_house_fan
    mode: single
    max_exceeded: silent
    trigger:
      platform: state
      entity_id: switch.house_fan
      to: "on"
    actions:
      - action: script.hvac_disable
      - delay: "00:01:00"
      - wait_template: "{{ is_state('binary_sensor.doors_and_windows', 'off') }}"
      - action: script.hvac_resume

  # safety net: a restart drops the wait in the two automations above,
  # so resume once it's safe if HVAC is still paused
  - alias: "Climate - Resume after restart"
    id: climate_resume_after_restart
    mode: single
    trigger:
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: binary_sensor.doors_and_windows
        to: "off"
        for: "00:01:00"
      - platform: state
        entity_id: switch.house_fan
        to: "off"
    condition:
      - condition: state
        entity_id: input_boolean.hvac_paused
        state: "on"
      - condition: state
        entity_id: binary_sensor.doors_and_windows
        state: "off"
      - condition: state
        entity_id: switch.house_fan
        state: "off"
    actions:
      - action: script.hvac_resume

  - alias: "Climate - Notify cooler outside than inside"
    id: climate_notify_cooler_outside_than_inside
    trigger:
      - platform: state
        entity_id: binary_sensor.climate_operation
        to: "on"
    condition:
      condition: template
      value_template: "{{ is_state('alarm_control_panel.alarm', 'disarmed') and is_state('climate.home', 'cool') and state_attr('climate.home', 'temperature')|int > states('sensor.outside_temp')|int }}"
    actions:
      - action: notify.phones
        data:
          title: "Home"
          message: "Open the windows! It's nicer outside than inside."
      - delay:
          hours: 8