kiosk_mode:
  # app ui
  hide_header: false
  hide_sidebar: false
  hide_menubutton: false
  hide_add_to_home_assistant: true
  hide_search: true
  hide_assistant: true
  hide_overflow: false
  # overrides
  mobile_settings:
    hide_sidebar: true
    hide_overflow: true
    hide_dialog_header_breadcrumb_navigation: true
    hide_dialog_header_settings: true
    hide_dialog_header_overflow: true
    
swipe_nav:
  wrap: false
  animate: swipe
  animate_duration: 100
  
# HA only re-reads this dashboard when THIS file changes, not the included
# views/v2/*.yaml: after pulling a views-only change, restart HA or touch it.
# last views change: 2026-11-08, thermostat block +10px
views:
  - !include views/v2/home.yaml
  - !include views/v2/lights.yaml
  - !include views/v2/media.yaml
  - !include views/v2/outside.yaml
  - !include views/v2/climate.yaml
  - !include views/v2/cameras.yaml
  - !include views/v2/advanced.yaml