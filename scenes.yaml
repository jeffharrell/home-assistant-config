- name: Good Morning
  id: scene_good_morning
  entities:
    light.kitchen_cabinets:
      state: on
    light.island:
      state: on
      brightness: 127
    light.dining_room: off
    light.family_room: off
    light.kitchen: off
    light.pantry: off

- name: Wake Up
  id: scene_wake_up
  entities:
    light.hallway: on
    light.boys_bedroom: on
    light.master_bedroom:
      state: on
      brightness: 80
      
- name: Mood Lights
  id: scene_mood_lights
  entities:
    light.kitchen:
      state: on
      brightness: 40
    light.entryway: 
      state: off
      brightness: 0
    light.dining_room: off
    light.family_room: off
    light.island: off
    light.pantry: off
    light.kitchen_cabinets: off

- name: Dinner Lights
  id: scene_dinner_lights
  entities:
    light.kitchen:
      state: on
      brightness: 120
    light.island: off
    light.pantry: off
    light.kitchen_cabinets: off

- name: Dinner Lights More
  id: scene_dinner_lights_more
  entities:
    light.family_room:
      state: on
      brightness: 40
    light.entryway:
      state: on
      brightness: 255

- name: House Off
  id: scene_house_off
  entities:
    light.house: off
    media_player.family_room_speakers: off
    media_player.living_room_speakers: off
    media_player.office_speakers: off
    media_player.outside_speakers: off
    switch.house_fan: off
    switch.twinkle_lights: off

- name: House Off Guest
  id: scene_house_off_guest
  entities:
    light.outside_area: off
    light.kitchen_area: off
    light.living_area: off
    light.hallway: off
    light.master_bedroom: off
    media_player.family_room_speakers: off
    media_player.living_room_speakers: off
    media_player.office_speakers: off
    media_player.outside_speakers: off
    switch.house_fan: off

- name: House Alert
  id: scene_house_alert
  entities:
    light.house:
      state: on
      brightness: 255
    light.front_door:
      state: on