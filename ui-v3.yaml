title: "Home"

kiosk_mode:
  # app ui
  hide_header: false
  hide_sidebar: false
  hide_menubutton: false
  hide_add_to_home_assistant: true
  hide_search: true
  hide_assistant: true
  hide_overflow: false
  # overrides
  mobile_settings:
    hide_sidebar: true
    hide_overflow: true
    hide_dialog_header_breadcrumb_navigation: true
    hide_dialog_header_settings: true
    hide_dialog_header_overflow: true

# swipe between the navbar tabs, like the classic. home/lights/media/more
# are subviews here, so don't skip subviews; instead skip the views that
# aren't tabs (climate, cameras, advanced = indexes 4,5,6 below). Keep the
# view order in step with skip_tabs.
swipe_nav:
  wrap: false
  animate: swipe
  animate_duration: 100
  skip_subviews: false
  skip_tabs: 4,5,6

# home is the only main view; the rest are subviews so the header
# shows a title + back arrow instead of a second row of tabs.
# the bottom navbar (views/v3/navbar.yaml) does the navigation.
#
# HA only re-reads this dashboard when THIS file's mtime changes, not the
# included views/v3/*.yaml. After pulling a views-only change, restart HA
# or touch this file, or the old views keep showing.
# last views change: 2026-11-08, swipe nav between tabs
views:
  # tabs, in navbar order (swiped through)
  - !include views/v3/home.yaml
  - !include views/v3/lights.yaml
  - !include views/v3/media.yaml
  - !include views/v3/more.yaml
  # reached from a page, not swiped to
  - !include views/v3/climate.yaml
  - !include views/v3/cameras.yaml
  - !include views/v3/advanced.yaml
